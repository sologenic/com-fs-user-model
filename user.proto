syntax = "proto3";

package user;

option go_package = "github.com/sologenic/com-fs-user-model;user";

import "google/protobuf/timestamp.proto";
import "sologenic/com-fs-utils-lib/models/metadata/metadata.proto";
import "sologenic/com-fs-utils-lib/models/audit/audit.proto";
import "sologenic/com-fs-utils-lib/models/role/role.proto";
import "sologenic/com-fs-utils-lib/models/language/language.proto";
import "sologenic/com-fs-trade-profile-model/tradeprofile.proto";
import "sologenic/com-fs-document-model/document.proto";
import "user-kyc.proto";
import "user-fundings.proto";
import "sologenic/com-fs-utils-lib/models/commission/commission.proto";
import "sologenic/com-fs-compliance-model/compliance.proto";
import "buf/validate/validate.proto";

message UserDetails {
    // Firebase User ID
    // Root & child users policy: always the same value
    // Immutable once set
    string UserID = 1 [
        (buf.validate.field).string = {
            min_len: 28,
            max_len: 128,
            pattern: "^[a-zA-Z0-9]+$"
        }
    ];

    // Root & child users policy: each user has its own value
    string FirstName = 2 [
        (buf.validate.field).string = {
            min_len: 2,
            max_len: 64,
            // 1. ^[\\p{L}] – First character must be alpha
            // 2. [\\p{L}\\s\\-']* – Allow alpha, dash (O'Connor), space (Anna Maria), dash (Jean-Baptiste)
            // 3. [\\p{L}]$ – Last character must be alpha
            pattern: "^[\\p{L}][\\p{L}\\s\\-']*[\\p{L}]$"
        }
    ];

    // Root & child users policy: each user has its own value
    string LastName = 3 [
        // Same logic as for first name
        (buf.validate.field).string = {
            min_len: 2,
            max_len: 64,
            pattern: "^[\\p{L}][\\p{L}\\s\\-']*[\\p{L}]$"
        }
    ];

    // Root & child users policy: each user has its own value
    string Address = 4 [
        (buf.validate.field).string = {
            max_len: 128
        }
    ];

    // Root & child users policy: each user has its own value
    string Avatar = 5 [
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
        (buf.validate.field).string = {
            uri: true,
            max_len: 256
        }
    ];

    // Nickname
    // Root & child users policy: always the same value
    // Immutable once set
    string Alias = 6 [
        (buf.validate.field).string = {
            min_len: 5,
            max_len: 32,
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*[a-zA-Z0-9]$"
        }
    ];

    // Root & child users policy: each user has its own value
    string Description = 7 [
        (buf.validate.field).string = {
            max_len: 512
        }
    ];

    // Root & child users policy: always the same value
    UserStatus Status = 8 [
        (buf.validate.field).enum.defined_only = true
    ];

    // Root & child users policy: always the same value
    repeated Wallet Wallets = 9 [
        (buf.validate.field).repeated = {
            max_items: 10,
        }
    ];

    // Root & child users policy: each user has its own value
    repeated Social Socials = 10 [
        (buf.validate.field).repeated = {
            max_items: 10,
        }
    ];

    // Root & child users policy: each user has its own value
    language.Lang Language = 11 [
        (buf.validate.field).enum.defined_only = true
    ];

    // External user UUID to be used in communication with the third-party services, or other places where an anonymous ID is required
    // Root & child users policy: always the same value
    // Immutable once set
    string ExternalUserID = 12 [
        (buf.validate.field).string = {
            uuid: true
        }
    ];

    // UUID of the current organization the user belongs to
    // Root & child users policy: each user has its own value
    // Immutable once set
    string OrganizationID = 13 [
        (buf.validate.field).string = {
            uuid: true
        }
    ];

    // A retail user will always have a role of "NORMAL_USER"
    // Root & child users policy: always the same value
    // Immutable once set
    role.Role Role = 15 [
        (buf.validate.field).enum = {
            defined_only: true
            in: [1]
        }
    ];

    // Root & child users policy: each user has its own value
    tradeprofile.TradeProfileDetails TradeProfile = 16 [
        (buf.validate.field).required = true
    ];

    // Array of Persona Inquiry IDs
    // We no longer update this field
    repeated string KYCInquiries = 17 [
        deprecated = true,
        (buf.validate.field).repeated = {
            max_items: 10,
            unique: true,
            items: {
                string: {
                    pattern: "^inq_[a-zA-Z0-9]+$",
                    min_len: 32,
                    max_len: 64
                }
            }
        }
    ];

    // Root & child users policy: child users should inherit KYCDetails if KYCIsFederated is false, otherwise each child has its own value
    UserKYCDetails KYCDetails = 18;

    // Root & child users policy: each user has its own value
    document.UserDocumentCompliance UserDocumentCompliance = 19;

    // Status of KYC verification, e.g., PENDING, APPROVED, REJECTED
    // Root & child users policy: child users should inherit KYCStatus if KYCIsFederated is false, otherwise each child has its own value
    KYCStatus KYCStatus = 20 [
        (buf.validate.field).enum.defined_only = true
    ];

    // Root & child users policy: child users should inherit KYCStatusUpdatedAt if KYCIsFederated is false, otherwise each child has its own value
    google.protobuf.Timestamp KYCStatusUpdatedAt = 41;

    // Root & child users policy: child users should inherit KYCUpdatedAt if KYCIsFederated is false, otherwise each child has its own value
    google.protobuf.Timestamp KYCUpdatedAt = 46;

    // Represents Persona account ID
    // Root & child users policy: each user has its own value
    // Immutable once set
    string KYCAccountID = 47 [
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
        (buf.validate.field).string = {
            max_len: 128,
        }
    ];

    // If not nil, it means KYC information has been shared with another Persona account via Persona Connect
    // Root & child users policy: each user has its own value
    // Immutable once set
    google.protobuf.Timestamp KYCSharedAt = 48;

    // Indicates if the organization uses a federated KYC model (e.g., Persona Connect).
    // In a federated model, the child organization fully manages the user's KYC verification
    // within its own Persona account. However, the root (TX) organization retains an absolute
    // veto right and can revoke access at any time.
    // Full trading functionality requires dual approval: the user must be KYC-approved by BOTH
    // the root (TX) and the child organization. If either approval is missing or denied,
    // the user will not be able to trade.
    // If true, KYC status is not automatically inherited – it requires explicit data sharing.
    // Root & child users policy: each user has its own value (KYCIsFederated is automatically set when user is being cloned).
    // Immutable once set.
    bool KYCIsFederated = 49;

    // Root & child users policy: each user has its own value
    tradeprofile.UserTradeProfile UserTradeProfile = 21 [
        (buf.validate.field).required = true
    ];

    // Root & child users policy: each user has its own value
    repeated BrokerAccount BrokerAccounts = 23;

    // Root & child users policy: each user has its own value
    UISettings UISettings = 25;

    // User level commission settings (overrides organization level)
    // Root & child users policy: each user has its own value
    optional commission.CommissionSettings CommissionSettings = 26;

    // Root & child users policy: each user has its own value
    optional DataFeedAccounts DataFeedAccounts = 27;

    // ISO 3166-1 alpha-3 code e.g. "USA", "CAN"
    // Root & child users policy: each user has its own value
    repeated string AllowedJurisdictions = 28 [
        (buf.validate.field).repeated = {
            max_items: 256,
            unique: true,
            items: {
                string: {
                    len: 3,
                    pattern: "^[A-Z]{3}$"
                }
            }
        }
    ];

    // Email address for the user, often retrieved from the authentication provider
    // Root & child users policy: always the same value
    // Immutable once set
    string EmailAddress = 29 [
        (buf.validate.field).string = {
            email: true,
            max_len: 254
        },
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];

    // Compliance form result
    // Root & child users policy: each user has its own value
    repeated compliance.ComplianceFormAnswer ComplianceFormAnswers = 30 [
        (buf.validate.field).repeated = {
            max_items: 32,
        }
    ];

    // User ID of the referrer who referred this user during signup or partner code
    // Root & child users policy: only the root user has a value, child users always have nil
    // Immutable once set
    optional string ReferredBy = 31 [
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
        (buf.validate.field).string = {
            min_len: 3,
            max_len: 128,
            pattern: "^[a-zA-Z0-9_\\-]+$"
        }
    ];

    // Number of referrals made by this user
    // Root & child users policy: only the root user has a value, child users always have nil
    optional int32 ReferralCount = 32 [
        (buf.validate.field).int32 = {
            gte: 0
        }
    ];

    // Maximum number of referrals this user can receive (admin override only)
    // Root & child users policy: only the root user has a value, child users always have nil
    optional int32 ReferralLimit = 33 [
        (buf.validate.field).int32 = {
            gte: 0
        }
    ];

    // Amount of TX the referring user received from referrals (non-mutable by user)
    // Root & child users policy: only the root user has a value, child users always have nil
    optional int64 ReferralAmountReceived = 34 [
        (buf.validate.field).int64 = {
            gte: 0
        }
    ];

    // Amount of TX associated with this user to be distributed to new users (admin override only)
    // Root & child users policy: only the root user has a value, child users always have nil
    optional int64 ReferralAmount = 35 [
        (buf.validate.field).int64 = {
            gte: 0
        }
    ];

    // Timestamp when the referral reward was paid
    // Root & child users policy: only the root user has a value, child users always have nil
    // Immutable once set
    google.protobuf.Timestamp ReferralPaidAt = 36;

    // x.com handle (must start with @)
    // Root & child users policy: only the root user has a value, child users always have nil
    optional string XHandle = 37 [
        (buf.validate.field).string = {
            pattern: "^@[A-Za-z0-9_]{1,15}$"
        },
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
    ];

    // Root & child users policy: only the root user has a value, child users always have a zero value
    EliteClubMembershipStatus EliteClubMembershipStatus = 38 [
        (buf.validate.field).enum.defined_only = true
    ];

    // Firebase Cloud Messaging (FCM) push tokens for iOS/Android devices
    // Root & child users policy: only the root user has a value, child users always have nil
    repeated string FCMPushTokens = 39 [
        (buf.validate.field).repeated = {
            max_items: 5,
            unique: true
        },
        (buf.validate.field).repeated.items.string = {
            min_len: 64,
            max_len: 512,
            pattern: "^[a-zA-Z0-9_:-]+$"
        }
    ];

    // Referral program reward multiplier represented in hundredths (basis points)
    // Example: 15 = 0.15x, 100 = 1.0x (default), 250 = 2.5x, 999 = 9.99x (maximum)
    // Root & child users policy: only the root user has a value, child users always have 100 (1.0x)
    int32 ReferralProgramRewardMultiplier = 40 [
        (buf.validate.field).int32 = {
            gt: 0,
            lt: 1000
        }
    ];

    // Cryptographic keychain for encryption/decrypting/verifying Alpaca order envelope
    // Root & child users policy: each user has its own value
    repeated AlpacaCryptoKeychain AlpacaCryptoKeychains = 42 [
        (buf.validate.field).repeated = {
            max_items: 5,
        }
    ];

    // Indicates user has requested a KYC sharing to Banxa if not nil
    // Root & child users policy: only the root user has a value, child users always have nil
    // Immutable once set
    google.protobuf.Timestamp BanxaSetupRequestedAt = 43;

    // Indicates KYC has been shared to Banxa at least once if not nil
    // Root & child users policy: only the root user has a value, child users always have nil
    // Immutable once set
    google.protobuf.Timestamp BanxaSetupCompletedAt = 44;

    // Firebase Installation IDs (FIDs) used to target FCM push delivery (Admin SDK MulticastMessage.Fids).
    // Typically 22 chars, legacy Instance IDs – ~11.
    // Root & child users policy: only the root user has a value, child users always have nil
    repeated string FCMPushFIDs = 45 [
        (buf.validate.field).repeated = {
            max_items: 5,
            unique: true
        },
        (buf.validate.field).repeated.items.string = {
            min_len: 11,
            max_len: 64,
            pattern: "^[a-zA-Z0-9_:-]+$"
        }
    ];
}

message User {
    UserDetails User = 1;
    metadata.MetaData MetaData = 2;
    audit.Audit Audit = 3;

    // If root user: list of organization IDs to which user was cloned. If child user: nil or empty.
    // Important: never includes root organization ID.
    repeated string OrganizationIDs = 4 [
        (buf.validate.field).repeated = {
            max_items: 256,
            unique: true,
            items: {
                string: {
                    uuid: true
                }
            }
        }
    ];
}

message Social {
    string URL = 1 [
        (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
        (buf.validate.field).string = {
            uri: true,
            max_len: 256
        }
    ];
    SocialType Type = 2 [
        (buf.validate.field).enum.defined_only = true
    ];
}

message UserList {
    repeated User Users = 1;
    optional int32 Offset = 2;
}

message StatusMessage {
    string UserID = 1;
    string OrganizationID = 2;
    UserStatus Status = 3 [
        (buf.validate.field).enum.defined_only = true
    ];
    optional metadata.Network Network = 4 [
        deprecated = true
    ];
    audit.Audit Audit = 5;
}

enum UserStatus {
    NOT_USED_USERSTATUS = 0;
    ACTIVE = 1;
    DEACTIVATED = 2;
}

enum SocialType {
    NOT_USED_SOCIALTYPE = 0;
    WEBSITE = 1;
    GITHUB = 2;
    REDDIT = 3;
    DISCORD = 4;
    TWITTER = 5;
    FACEBOOK = 6;
    TELEGRAM = 7;
    INSTAGRAM = 8;
    LINKEDIN = 9;
}

message UISettings {
    Theme Theme = 1 [
        (buf.validate.field).enum.defined_only = true
    ];
}

enum Theme {
    NOT_USED_THEME = 0;
    DARK = 1;
    LIGHT = 2;
}

message DataFeedAccounts {
    optional DxFeed DxFeed = 1;
}

message DxFeed {
    string AccountID = 1;
}

enum EliteClubMembershipStatus {
    ELITE_CLUB_MEMBERSHIP_STATUS_NONE = 0; // No request to add to the club submitted
    ELITE_CLUB_MEMBERSHIP_STATUS_PENDING = 1; // Request to add to the club submitted, pending administrator decision
    ELITE_CLUB_MEMBERSHIP_STATUS_ACTIVE = 2; // Request has been approved by administrator, it is not allowed to resubmit application
    ELITE_CLUB_MEMBERSHIP_STATUS_REJECTED = 3; // Request has been rejected by administrator, it is allowed to resubmit application
}

message AlpacaCryptoKeychain {
    int32 ID = 1 [
        (buf.validate.field).int32 = {gt: 0}
    ];

    // Ed25519 key for server signature check
    string PublicKeyHex = 2 [
        (buf.validate.field).string = {
            len: 64,
            pattern: "^[0-9a-fA-F]{64}$"
        }
    ];

    // Ed25519 key for server signature generation
    string PrivateKeyHex = 3 [
        (buf.validate.field).string = {
            len: 128,
            pattern: "^[0-9a-fA-F]{128}$"
        }
    ];

    // AES key used for encrypting/decrypting data (shared with user)
    string SymmetricKeyHex = 4 [
        (buf.validate.field).string = {
            len: 64,
            pattern: "^[0-9a-fA-F]{64}$"
        }
    ];
}